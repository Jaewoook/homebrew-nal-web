name: Feature Request
description: Suggest an idea or enhancement for homebrew-nal-web
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please check existing issues and discussions before opening a new request.

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: A concise summary of the proposed feature or improvement.
      placeholder: What would you like to see added or improved?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem? What user need or pain point does this address?
      placeholder: I am always frustrated when... / As a tap maintainer, I need to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Design
      description: Describe your proposed solution or how you envision the user experience / API working.
      placeholder: Describe the changes, UI mockups, or API contracts...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered?
      placeholder: I considered using... but it fell short because...
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, references, screenshots, or related tools.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be interested in submitting a pull request for this feature.
          required: false
