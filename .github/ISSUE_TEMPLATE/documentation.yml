name: Documentation Issue
description: Report an issue or suggest improvements for project documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the documentation for homebrew-nal-web!

  - type: textarea
    id: docs-location
    attributes:
      label: Documentation Area / File
      description: Where is the documentation located? (e.g. README.md, .env.example, Docker setup, API guides)
      placeholder: e.g. README.md, Docker compose deployment instructions
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is unclear, outdated, or missing?
      description: Describe the problem with the current documentation.
      placeholder: The setup instructions for PostgreSQL don't mention...
    validations:
      required: true

  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested Improvement / Fix
      description: What should the documentation say instead?
      placeholder: Provide the suggested text, commands, or links...
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would like to submit a PR to update the documentation.
          required: false
