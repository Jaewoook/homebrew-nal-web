services:
  homebrew-nal-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: homebrew-nal-web:latest
    container_name: homebrew-nal-web
    restart: unless-stopped
    ports:
      - "${PORT:-10245}:10245"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-10245}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO_OWNER=${GITHUB_REPO_OWNER:-jaewoook}
      - GITHUB_REPO_NAME=${GITHUB_REPO_NAME:-homebrew-nal}
      - GITHUB_SYNC_WORKFLOW=${GITHUB_SYNC_WORKFLOW:-sync-upstream.yml}
      - GITHUB_BUILD_WORKFLOW=${GITHUB_BUILD_WORKFLOW:-build.yml}
      - AUTHENTIK_ISSUER=${AUTHENTIK_ISSUER}
      - AUTHENTIK_CLIENT_ID=${AUTHENTIK_CLIENT_ID}
      - AUTHENTIK_CLIENT_SECRET=${AUTHENTIK_CLIENT_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:10245}
      # Database Configuration (Kysely ORM: SQLite, PostgreSQL, MySQL/MariaDB)
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DATABASE_PATH=${DATABASE_PATH:-/app/data/app.db}
      - PG_HOST=${PG_HOST:-}
      - PG_PORT=${PG_PORT:-}
      - PG_DB=${PG_DB:-}
      - PG_USER=${PG_USER:-}
      - PG_PASS=${PG_PASS:-}
      - MYSQL_HOST=${MYSQL_HOST:-}
      - MYSQL_PORT=${MYSQL_PORT:-}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-}
      - MYSQL_USER=${MYSQL_USER:-}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-}
    volumes:
      - homebrew_nal_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:10245/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  homebrew_nal_data:
