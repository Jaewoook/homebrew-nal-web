services:
  homebrew-nal-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: homebrew-nal-web:latest
    container_name: homebrew-nal-web
    restart: unless-stopped
    expose:
      - "${PORT}"
    environment:
      - NODE_ENV=production
    env_file:
      .env
    volumes:
      - homebrew_nal_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:10245/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  homebrew_nal_data:
