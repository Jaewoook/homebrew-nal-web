services:
  homebrew-nal-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: homebrew-nal-web:latest
    container_name: homebrew-nal-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO_OWNER=${GITHUB_REPO_OWNER:-jaewoook}
      - GITHUB_REPO_NAME=${GITHUB_REPO_NAME:-homebrew-nal}
      - GITHUB_SYNC_WORKFLOW=${GITHUB_SYNC_WORKFLOW:-sync-upstream.yml}
      - GITHUB_BUILD_WORKFLOW=${GITHUB_BUILD_WORKFLOW:-build.yml}
      - AUTHENTIK_ISSUER=${AUTHENTIK_ISSUER}
      - AUTHENTIK_CLIENT_ID=${AUTHENTIK_CLIENT_ID}
      - AUTHENTIK_CLIENT_SECRET=${AUTHENTIK_CLIENT_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - DATABASE_PATH=/data/app.db
    volumes:
      - nal_brew_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - nal-network

volumes:
  nal_brew_data:
    name: nal_brew_data

networks:
  nal-network:
    external: true
